name: flutter_application_1
description: "Auto Connect Mali, une application Flutter pour trouver et gerer des services automobiles au Mali."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  google_maps_flutter: ^2.5.3
  url_launcher: ^6.2.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.4+2
  sqflite_common_ffi_web: ^0.4.5+2
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.0
  path: ^1.9.0
  uuid: ^4.0.0
  provider: ^6.1.5
  share_plus: ^12.0.2
  crypto: ^3.0.3

dependency_overrides:
  geolocator_android: 4.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true